# Fork: production override for docker-compose.yml (docs/fork/deploy.md).
# Copy to docker-compose.override.yml in the checkout; Compose merges it automatically.
# Keep everything else in .env (APP_BIND, APP_PORT, ...), not here: Compose adds list
# entries such as ports to the base file's instead of replacing them.
services:
  odysseus:
    # Run the locally built fork image (scripts/fork_deploy.sh). Without this, Compose
    # pulls upstream's ghcr.io/odysseus-dev/odysseus image and runs plain Odysseus.
    image: odysseus-fork:${FORK_TAG:-current}
    pull_policy: never
    environment:
      # Module MCP servers whose readOnlyHint tools run without approval
      # (fork/mcp/trust.py). Comma separated, e.g. convo,<next module>.
      - ODYSSEUS_TRUSTED_READONLY_MCP=convo
      # Handwritten notes (fork/ink/transcribe.py, H6): 1 sends pages the model read
      # without [?] to Athena without review. Off unless set in .env; decide it with
      # scripts/ink_eval.py (docs/fork/handwritten-notes.md#built-in-h6).
      - INK_AUTO_SEND=${INK_AUTO_SEND:-}
      # The fork's other settings, read from .env next to docker-compose.yml. Unset in
      # .env means the code's default; an empty value means the same for each of these
      # (tests/test_fork_override_env.py lists every setting the fork's code reads).
      # Athena: which MCP server (fork/athena/action_items.py, fork/athena/call_recorder.py), its
      # to-dos, notes and facts (docs/fork/modules/odysseus-sound.md). BARVIS_* are the
      # former names, still read when the new one is unset.
      - MODULE_ACTION_ITEMS_SERVER=${MODULE_ACTION_ITEMS_SERVER:-}
      - MODULE_NOTIFY_CHANNEL=${MODULE_NOTIFY_CHANNEL:-}
      - MODULE_DIGEST_HOUR=${MODULE_DIGEST_HOUR:-}
      - MODULE_FILE_ITEMS=${MODULE_FILE_ITEMS:-}
      - MODULE_FACTS_SYNC=${MODULE_FACTS_SYNC:-}
      - BARVIS_ACTION_ITEMS_SERVER=${BARVIS_ACTION_ITEMS_SERVER:-}
      - BARVIS_NOTIFY_CHANNEL=${BARVIS_NOTIFY_CHANNEL:-}
      - BARVIS_DIGEST_HOUR=${BARVIS_DIGEST_HOUR:-}
      - BARVIS_FILE_ITEMS=${BARVIS_FILE_ITEMS:-}
      - BARVIS_FACTS_SYNC=${BARVIS_FACTS_SYNC:-}
      - SOUND_MODULE_SERVER=${SOUND_MODULE_SERVER:-}
      - BARVIS_SOUND_SERVER=${BARVIS_SOUND_SERVER:-}
      - SOUND_MODULE_CALL_DEVICE=${SOUND_MODULE_CALL_DEVICE:-}
      # Beliefs (docs/fork/beliefs.md): fork/beliefs/evidence_intake.py, fork/beliefs/consolidation.py,
      # fork/beliefs/structure.py, fork/beliefs/notes_evidence.py.
      - BELIEF_CONFIRM_SOURCES=${BELIEF_CONFIRM_SOURCES:-}
      - BELIEF_CONFIRM_TIMES=${BELIEF_CONFIRM_TIMES:-}
      - BELIEF_CONFIRM_DAYS=${BELIEF_CONFIRM_DAYS:-}
      - BELIEF_STALE_DAYS=${BELIEF_STALE_DAYS:-}
      - BELIEF_CONSOLIDATE=${BELIEF_CONSOLIDATE:-}
      - BELIEF_STRUCTURE=${BELIEF_STRUCTURE:-}
      - BELIEF_STRUCTURE_BATCH=${BELIEF_STRUCTURE_BATCH:-}
      - EVIDENCE_NOTES=${EVIDENCE_NOTES:-}
      # Today insight (docs/fork/today-insight.md): fork/insight/today.py, fork/insight/push.py.
      - TODAY_INSIGHT_ENABLED=${TODAY_INSIGHT_ENABLED:-}
      - TODAY_INSIGHT_PUSH=${TODAY_INSIGHT_PUSH:-}
      # No "=": an empty value means "skip no lists", unlike unset (the default lists),
      # so Compose passes it only when .env sets it.
      - TODAY_INSIGHT_SKIP_LISTS
      # Agent turns: fork/routing/personal_read_grants.py, fork/routing/personal_store_escalation.py (on
      # unless 0/false/no/off), fork/hub/checklist_auto_archive.py.
      - ODYSSEUS_PERSONAL_READ_GRANTS=${ODYSSEUS_PERSONAL_READ_GRANTS:-}
      - ODYSSEUS_PERSONAL_STORE_ESCALATION=${ODYSSEUS_PERSONAL_STORE_ESCALATION:-}
      - FORK_CHECKLIST_ARCHIVE_MINUTES=${FORK_CHECKLIST_ARCHIVE_MINUTES:-}
      # Links in handwritten notes sent to Athena (fork/ink/athena.py) when Settings has
      # no public URL; upstream's MCP OAuth redirect (src/mcp_oauth.py) reads it too.
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}

  # Fork: forwards host services that listen only on 127.0.0.1 (Proton Mail Bridge IMAP
  # 1143 / SMTP 1025) to the Docker bridge address, where the odysseus container reaches
  # them as host.docker.internal:<port>. Nothing is opened on the LAN. Ports in .env:
  # HOST_RELAY_PORTS=1143,1025 (empty = idle). Replaces socat started by hand on the host;
  # stop those first, they hold the same addresses (docs/fork/deploy.md).
  host-relay:
    image: docker.io/alpine/socat@sha256:22d77becaeeea8ef56b8c4bb2312323acafe85354be6a85714ff5050e3537842  # 1.8.1.3
    network_mode: host
    environment:
      - HOST_RELAY_PORTS=${HOST_RELAY_PORTS:-}
      - HOST_RELAY_BIND=${HOST_RELAY_BIND:-172.17.0.1}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        pids=""
        for port in $$(echo "$$HOST_RELAY_PORTS" | tr ',' ' '); do
          echo "forwarding $$HOST_RELAY_BIND:$$port -> 127.0.0.1:$$port"
          socat "TCP-LISTEN:$$port,bind=$$HOST_RELAY_BIND,fork,reuseaddr" "TCP:127.0.0.1:$$port" &
          pids="$$pids $$!"
        done
        [ -n "$$pids" ] || exec sleep 2147483647
        # One forwarder died (e.g. its address is taken): exit so Docker restarts all.
        while kill -0 $$pids 2>/dev/null; do sleep 5; done
        echo "a forwarder stopped; exiting" >&2
        exit 1
    restart: unless-stopped
